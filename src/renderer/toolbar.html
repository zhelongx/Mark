<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ZhelongX / Mark</title><link rel="stylesheet" href="./toolbar.css"/><link rel="stylesheet" href="./toolbar-fixes.css"/></head>
<body><main class="rack is-collapsed" id="rack">
  <button class="carrot" id="carrot" aria-label="展开工具架"><img src="../../assets/icons/carrot-purple.png" alt=""/></button>
  <i class="handle-divider" aria-hidden="true"></i>
  <div class="tools" id="tools">
    <button class="tool" data-command="pen" aria-label="铅笔"><img src="../../assets/icons/pencil.png" alt=""/></button>
    <button class="tool" data-command="eraser" aria-label="橡皮擦"><img src="../../assets/icons/eraser-alpha-fixed.png" alt=""/></button>
    <button class="tool" data-command="highlighter" aria-label="荧光笔"><img src="../../assets/icons/highlighter.png" alt=""/></button>
    <i class="divider" aria-hidden="true"></i>
    <button class="tool tool-clear" data-command="clear" aria-label="清除所有笔迹"><img src="../../assets/icons/undo.png" alt=""/></button>
    <button class="tool" data-command="screenshot" aria-label="矩形截图"><img src="../../assets/icons/camera.png" alt=""/></button>
    <i class="divider" aria-hidden="true"></i>
    <button class="tool" id="colorsButton" aria-label="颜色"><img src="../../assets/icons/palette.png" alt=""/></button>
    <button class="tool" id="settingsButton" aria-label="设置"><img src="../../assets/icons/gear-alpha-fixed-v2.png" alt=""/></button>
  </div>
  <section class="popover colors" id="colors"><button class="panel-close" data-close-panel="colors" aria-label="关闭颜色面板"></button><h2>颜色</h2><div class="swatches"><button data-color="#f04e4e" style="--c:#f04e4e"></button><button data-color="#f39427" style="--c:#f39427"></button><button data-color="#f6cd36" style="--c:#f6cd36"></button><button data-color="#75c96b" style="--c:#75c96b"></button><button data-color="#4eaeed" style="--c:#4eaeed"></button><button data-color="#9a71d6" style="--c:#9a71d6"></button></div><label>粗细 <input id="size" type="range" min="1" max="12" value="4"/><output id="sizeValue">4</output></label><label>铅笔强度 <input id="strength" type="range" min="0" max="100" value="50"/><output id="strengthValue">50</output></label></section>
  <section class="popover settings" id="settings"><button class="panel-close" data-close-panel="settings" aria-label="关闭设置面板"></button><h2>设置</h2><label class="setting"><span>暗色模式</span><input id="theme" type="checkbox"/></label><label class="setting"><span>自动收起</span><input id="autoHide" type="checkbox"/></label><label class="delay"><span>延时</span><select id="hideDelay"><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></label><button class="exit" id="exit">退出 ZhelongX / Mark</button></section>
  <nav class="context-menu" id="contextMenu" aria-label="萝卜菜单" aria-hidden="true"><button data-context-action="hide">最小化到托盘</button><button data-context-action="end">结束本次标注</button><i aria-hidden="true"></i><button class="danger" data-context-action="quit">退出 ZhelongX / Mark</button></nav>
</main><script src="./toolbar.js"></script></body></html>
